<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="footerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="130" rx="16" fill="#090d16" />
  <rect width="1200" height="130" rx="16" fill="url(#footerGlow)" />
  <rect width="1198" height="128" x="1" y="1" rx="15" fill="none" stroke="url(#footerBorder)" stroke-width="1.2" />

  <g transform="translate(60, 42)">
    <!-- Monogram Mark -->
    <rect width="46" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="23" y="30" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="url(#monogramGrad)">DA</text>

    <!-- Center Statement -->
    <g transform="translate(70, 16)">
      <text class="sans" font-size="16" font-weight="700" fill="#f8fafc">
        Think deeply. Design with intention. Build with precision.
      </text>
      <text y="24" class="sans" font-size="12.5" fill="#64748b">
        Crafted by Danial Ahmed • Open-source portfolio &amp; continuous experiments
      </text>
    </g>

    <!-- Right Side Badges -->
    <g transform="translate(1080, 24)">
      <text text-anchor="end" class="mono" font-size="12" fill="#38bdf8">danycli // 2026</text>
      <circle cx="-135" cy="-4" r="3.5" fill="#10b981" />
    </g>
  </g>
</svg>
